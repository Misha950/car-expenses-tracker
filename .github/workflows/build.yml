name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Забрати код
        uses: actions/checkout@v4

      - name: Встановити .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Відновити залежності
        run: dotnet restore car-expenses-tracker.sln

      - name: Зібрати проєкт
        run: dotnet build car-expenses-tracker.sln --configuration Release --no-restore

      - name: Запустити тести
        if: hashFiles('**/*Tests.csproj') != ''
        run: dotnet test car-expenses-tracker.sln --configuration Release --no-build